<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cassandra Live — Debate Fact Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #07080c;
    --panel: #11141c;
    --border: #222736;
    --text: #e9ebf0;
    --muted: #858ca0;
    --accent: #6ea8fe;
    --true: #2fbf74;
    --false: #e5484d;
    --misleading: #e5a83a;
    --unverified: #7c8598;
    --live: #ff3b30;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .live-badge {
    display: none; align-items: center; gap: 7px;
    background: rgba(255,59,48,.14); color: var(--live);
    border: 1px solid rgba(255,59,48,.4);
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 800; letter-spacing: 1px;
  }
  .live-badge.on { display: inline-flex; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live); animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,59,48,.75); opacity: 1; }
    70%  { box-shadow: 0 0 0 8px rgba(255,59,48,0); opacity: .75; }
    100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); opacity: 1; }
  }
  .clock {
    margin-left: auto; display: flex; align-items: center; gap: 16px;
    font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .clock .counts strong { color: var(--text); }

  .controls { display: flex; gap: 10px; padding: 14px 20px; }
  .controls input[type=text], .controls select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  .controls input[type=text] { flex: 1; }
  .controls button {
    background: var(--accent); border: none; color: #06070a;
    font-weight: 700; padding: 10px 18px; border-radius: 8px;
    cursor: pointer; font-size: 14px;
  }
  .controls button.stop { background: transparent; border: 1px solid var(--border); color: var(--text); }

  main {
    display: grid; grid-template-columns: minmax(0,1fr) 380px;
    gap: 16px; padding: 0 20px 20px; align-items: start;
  }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }

  /* ---------- video stage + overlay ---------- */
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* audio-only visualiser, shown when there's no video to embed */
  .visualiser {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center; gap: 5px;
    background: radial-gradient(ellipse at center, #141926 0%, #07080c 75%);
  }
  .visualiser.on { display: flex; }
  .visualiser span {
    width: 5px; height: 14px; border-radius: 3px; background: var(--accent); opacity: .55;
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce { 0%,100% { height: 12px; } 50% { height: 64px; } }
  .visualiser .label {
    position: absolute; bottom: 26%; width: 100%; text-align: center;
    color: var(--muted); font-size: 12px; letter-spacing: 2px;
    animation: none; background: none; opacity: 1;
  }

  /* live captions burned over the bottom of the video */
  .captions {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 60px 28px 22px;
    background: linear-gradient(transparent, rgba(0,0,0,.55) 40%, rgba(0,0,0,.9));
    pointer-events: none;
  }
  .caption-line {
    font-size: clamp(15px, 1.7vw, 22px); line-height: 1.45;
    font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,.9);
    min-height: 1.45em;
  }
  .caption-line .w { opacity: 0; animation: wordIn .18s ease-out forwards; }
  @keyframes wordIn { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
  .caption-prev { font-size: 13px; color: #b6bccb; opacity: .55; margin-bottom: 6px; min-height: 1.3em; }

  /* fact-check cards floating over the video */
  .overlay-cards {
    position: absolute; top: 14px; right: 14px;
    width: min(46%, 380px);
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  .ocard {
    pointer-events: auto;
    /* deliberately not backdrop-filter: it stalls compositing and can cost
       frames mid-pitch, and over video a solid panel reads more legibly anyway */
    background: rgba(10,13,20,.96);
    border: 1px solid var(--border);
    border-left: 3px solid var(--unverified);
    border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
    animation: cardIn .42s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .ocard.leaving { animation: cardOut .35s ease-in forwards; }
  @keyframes cardIn  { from { opacity: 0; transform: translateX(28px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes cardOut { to { opacity: 0; transform: translateX(20px) scale(.96); height: 0; margin: 0; padding: 0; } }
  .ocard.TRUE        { border-left-color: var(--true); }
  .ocard.FALSE       { border-left-color: var(--false); }
  .ocard.MISLEADING  { border-left-color: var(--misleading); }
  .ocard.UNVERIFIED  { border-left-color: var(--unverified); }
  .ocard .ct { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
  .ocard .ex { font-size: 12px; color: #a9b0c0; line-height: 1.4; margin-top: 6px; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 800; letter-spacing: .6px;
    padding: 3px 9px; border-radius: 999px; color: #06070a;
  }
  .badge.checking {
    background: linear-gradient(90deg,#2b3244,#3d4763,#2b3244);
    background-size: 200% 100%; color: #cdd4e3;
    animation: shimmer 1.1s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .badge.TRUE { background: var(--true); }
  .badge.FALSE { background: var(--false); }
  .badge.MISLEADING { background: var(--misleading); }
  .badge.UNVERIFIED { background: var(--unverified); }
  .badge .spin {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- side panels ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 0 0 10px;
  }
  .scroll { max-height: 340px; overflow-y: auto; }
  .hcard {
    border: 1px solid var(--border); border-left: 3px solid var(--unverified);
    border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; background: #0d1017;
    animation: cardIn .3s ease-out both;
  }
  .hcard.TRUE { border-left-color: var(--true); }
  .hcard.FALSE { border-left-color: var(--false); }
  .hcard.MISLEADING { border-left-color: var(--misleading); }
  .hcard.UNVERIFIED { border-left-color: var(--unverified); }
  .hcard .ct { font-size: 13px; line-height: 1.4; margin-bottom: 7px; }
  .hcard .ex { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 6px; }
  .sources { margin-top: 7px; font-size: 11px; }
  .sources a { color: var(--accent); margin-right: 9px; text-decoration: none; }
  .sources a:hover { text-decoration: underline; }

  #transcript p { margin: 0 0 7px; line-height: 1.5; color: #c3c9d6; font-size: 13px; }
  #transcript .ts { color: var(--muted); font-size: 10px; margin-right: 7px; font-variant-numeric: tabular-nums; }
  #transcript p.fresh { animation: wordIn .3s ease-out both; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>Cassandra Live</h1>
  <span class="live-badge" id="liveBadge"><span class="live-dot"></span>LIVE</span>
  <div class="clock">
    <span class="counts"><strong id="claimCount">0</strong> claims · <strong id="verdictCount">0</strong> checked</span>
    <span id="elapsed">00:00</span>
    <span id="status">idle</span>
  </div>
</header>

<div class="controls">
  <input id="url" type="text" placeholder="YouTube video or live stream URL…">
  <select id="mode">
    <option value="transcript" selected>Sample debate (Gemma + SerpApi live)</option>
    <option value="live">Live YouTube</option>
    <option value="cached">Cached replay (offline)</option>
  </select>
  <button id="startBtn">Start</button>
  <button id="stopBtn" class="stop">Stop</button>
</div>

<main>
  <div>
    <div class="stage" id="stage">
      <div class="visualiser on" id="visualiser">
        <span style="animation-delay:0s"></span><span style="animation-delay:.1s"></span>
        <span style="animation-delay:.2s"></span><span style="animation-delay:.3s"></span>
        <span style="animation-delay:.4s"></span><span style="animation-delay:.5s"></span>
        <span style="animation-delay:.6s"></span><span style="animation-delay:.7s"></span>
        <span style="animation-delay:.8s"></span><span style="animation-delay:.7s"></span>
        <span style="animation-delay:.6s"></span><span style="animation-delay:.5s"></span>
        <span style="animation-delay:.4s"></span><span style="animation-delay:.3s"></span>
        <span style="animation-delay:.2s"></span><span style="animation-delay:.1s"></span>
        <div class="label" id="visLabel">LISTENING</div>
      </div>
      <div class="overlay-cards" id="overlayCards"></div>
      <div class="captions">
        <div class="caption-prev" id="captionPrev"></div>
        <div class="caption-line" id="captionLine"></div>
      </div>
    </div>
  </div>

  <div>
    <section class="panel">
      <h2>Fact-check history</h2>
      <div class="scroll" id="claims"><p class="hint">Claims Gemma spots will appear here with their verdicts and sources.</p></div>
    </section>
    <section class="panel">
      <h2>Transcript</h2>
      <div class="scroll" id="transcript"><p class="hint">Live transcript will appear here.</p></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status'), liveBadge = $('liveBadge'), elapsedEl = $('elapsed');
const captionLine = $('captionLine'), captionPrev = $('captionPrev');
const overlayCards = $('overlayCards'), claimsEl = $('claims'), transcriptEl = $('transcript');
const stage = $('stage'), visualiser = $('visualiser'), visLabel = $('visLabel');

let ws = null, sessionId = null, startedAt = null, timer = null;
let claimCount = 0, verdictCount = 0;
const cards = {};          // claim_id -> { overlay, history }
const captionQueue = [];
let captionPlaying = false;

/* ---------- helpers ---------- */
function setStatus(t) { statusEl.textContent = t; }

function setLive(on) {
  liveBadge.classList.toggle('on', on);
  if (on) {
    startedAt = Date.now();
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      elapsedEl.textContent =
        `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
    }, 500);
  } else if (timer) {
    clearInterval(timer); timer = null;
  }
}

function clearHint(el) { const h = el.querySelector('.hint'); if (h) h.remove(); }

function youtubeId(url) {
  const m = url.match(/(?:youtu\.be\/|v=|\/embed\/|\/live\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function mountVideo(url) {
  const id = youtubeId(url);
  if (!id) return false;
  const frame = document.createElement('iframe');
  frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
  frame.allow = 'autoplay; encrypted-media; picture-in-picture';
  frame.allowFullscreen = true;
  stage.insertBefore(frame, stage.firstChild);
  visualiser.classList.remove('on');
  return true;
}

/* ---------- live captions, revealed word by word ---------- */
function enqueueCaption(text, durationMs) {
  captionQueue.push({ text, durationMs });
  if (!captionPlaying) playNextCaption();
}

function playNextCaption() {
  const next = captionQueue.shift();
  if (!next) { captionPlaying = false; return; }
  captionPlaying = true;

  if (captionLine.textContent.trim()) captionPrev.textContent = captionLine.textContent;

  const words = next.text.split(/\s+/).filter(Boolean);
  // Reveal across the segment's own duration, but never crawl or blur past it.
  const total = Math.max(600, Math.min(next.durationMs || 2500, 6000));
  const step = total / Math.max(words.length, 1);

  captionLine.innerHTML = '';
  words.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'w';
    span.textContent = w + ' ';
    span.style.animationDelay = `${(i * step)}ms`;
    captionLine.appendChild(span);
  });

  setTimeout(playNextCaption, total);
}

/* ---------- events ---------- */
function onTranscript(ev) {
  const durationMs = Math.max(0, (ev.end - ev.start)) * 1000;
  enqueueCaption(ev.text, durationMs);

  clearHint(transcriptEl);
  const p = document.createElement('p');
  p.className = 'fresh';
  const m = Math.floor(ev.start / 60), s = String(Math.floor(ev.start % 60)).padStart(2,'0');
  p.innerHTML = `<span class="ts">${m}:${s}</span>${escapeHtml(ev.text)}`;
  transcriptEl.appendChild(p);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function onClaim(ev) {
  claimCount++; $('claimCount').textContent = claimCount;

  const overlay = document.createElement('div');
  overlay.className = 'ocard';
  overlay.innerHTML = `
    <div class="ct">${escapeHtml(ev.text)}</div>
    <span class="badge checking"><span class="spin"></span>CHECKING</span>
    <div class="ex" data-role="ex"></div>`;
  overlayCards.appendChild(overlay);
  trimOverlay();

  clearHint(claimsEl);
  const history = document.createElement('div');
  history.className = 'hcard';
  history.innerHTML = `
    <div class="ct">${escapeHtml(ev.text)}</div>
    <span class="badge checking"><span class="spin"></span>CHECKING</span>
    <div class="ex" data-role="ex"></div>
    <div class="sources" data-role="sources"></div>`;
  claimsEl.prepend(history);

  cards[ev.id] = { overlay, history };
}

function onVerdict(ev) {
  verdictCount++; $('verdictCount').textContent = verdictCount;
  const pair = cards[ev.claim_id];
  if (!pair) return;

  const pct = Math.round((ev.confidence || 0) * 100);
  for (const el of [pair.overlay, pair.history]) {
    if (!el) continue;
    el.classList.add(ev.label);
    const badge = el.querySelector('.badge');
    badge.className = `badge ${ev.label}`;
    badge.textContent = `${ev.label} · ${pct}%`;
    const ex = el.querySelector('[data-role=ex]');
    if (ex) ex.textContent = ev.explanation || '';
  }

  const src = pair.history.querySelector('[data-role=sources]');
  if (src) {
    src.innerHTML = (ev.sources || [])
      .map((l, i) => `<a href="${escapeAttr(l)}" target="_blank" rel="noopener">source ${i+1}</a>`)
      .join('');
  }

  // let the verdict sit on screen, then retire the overlay card
  setTimeout(() => retireOverlay(pair.overlay), 9000);
}

function trimOverlay() {
  while (overlayCards.children.length > 3) retireOverlay(overlayCards.firstElementChild);
}

function retireOverlay(el) {
  if (!el || !el.isConnected || el.classList.contains('leaving')) return;
  el.classList.add('leaving');
  setTimeout(() => el.remove(), 350);
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function escapeAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }

/* ---------- session ---------- */
function connect(id) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${id}`);
  ws.onopen = () => { setStatus('listening'); setLive(true); };
  ws.onclose = () => { setStatus('disconnected'); setLive(false); };
  ws.onerror = () => setStatus('connection error');
  ws.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === 'transcript') onTranscript(ev);
    else if (ev.type === 'claim') onClaim(ev);
    else if (ev.type === 'verdict') onVerdict(ev);
    else if (ev.type === 'done') { setStatus('finished'); setLive(false); visLabel.textContent = 'FINISHED'; }
    else if (ev.type === 'error') { setStatus(`error: ${ev.message}`); setLive(false); }
  };
}

$('startBtn').addEventListener('click', async () => {
  const youtube_url = $('url').value.trim();
  const mode = $('mode').value;
  if (mode === 'live' && !youtube_url) { setStatus('paste a URL first'); return; }

  // Any mode can embed a video: in sample mode it just plays alongside.
  if (youtube_url) mountVideo(youtube_url);

  setStatus('starting…');
  const res = await fetch('/api/sessions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ youtube_url, mode }),
  });
  const data = await res.json();
  sessionId = data.session_id;
  connect(sessionId);
});

$('stopBtn').addEventListener('click', async () => {
  if (!sessionId) return;
  await fetch(`/api/sessions/${sessionId}/stop`, { method: 'POST' });
  setStatus('stopped'); setLive(false);
  if (ws) ws.close();
});
</script>
</body>
</html>
